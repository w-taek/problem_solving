name: Deploy Quartz
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quartz
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout notes
        uses: actions/checkout@v4
        with:
          repository: w-taek/obsidian-cs
          path: notes-src
          token: ${{ secrets.NOTES_TOKEN }}
      - name: Place notes into content
        run: |
          echo "=== PWD ==="; pwd
          echo "=== ls workspace root ==="; ls -la
          echo "=== ls notes-src ==="; ls -la notes-src || echo "NO notes-src"
          echo "=== ls notes-src/PS ==="; ls -la notes-src/PS || echo "NO notes-src/PS"
          rm -rf content
          cp -R notes-src/PS content
          echo "=== ls content ==="; ls -la content || echo "NO content"
          echo "=== find content ==="; find content -maxdepth 2 | head -40
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        